spring.application.name=REVIEW-SERVICE
server.port=8093

#spring.datasource.url=jdbc:postgresql://localhost:5432/review_db
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL:jdbc:postgresql://host.docker.internal:5432/review_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}


# Hibernate & SQL Logging
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
logging.level.org.hibernate.orm.jdbc.bind=trace

# Eureka Client Registration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Set sampling probability to 1.0 (100% of requests traced for development)
management.tracing.sampling.probability=1.0

# Zipkin server endpoint (default: http://localhost:9411/api/v2/spans)
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans

# Include traceId and spanId in standard console logs
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

# RabbitMQ Configuration
#spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}